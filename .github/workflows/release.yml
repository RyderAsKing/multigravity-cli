name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - name: Validate tag
        run: |
          tag='${{ github.ref_name }}'
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck shfmt
      - name: Test and build
        run: |
          version='${{ github.ref_name }}'
          make release-check VERSION="${version#v}"
      - name: Generate checksum
        working-directory: dist
        run: sha256sum multigravity > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/multigravity dist/SHA256SUMS --generate-notes --title '${{ github.ref_name }}'
