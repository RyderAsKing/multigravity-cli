name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck shfmt
      - name: Lint and test
        run: make lint test
      - name: Reproducible build
        run: make reproducible
      - name: Security source scan
        run: |
          ! grep -R -E 'raw\.githubusercontent\.com|sujitagarwal|PowerShell|Darwin|Windows' \
            --exclude-dir=.git --exclude-dir=.opencode --exclude=NOTICE.md --exclude=Makefile --exclude=ci.yml .

  containers:
    name: Compatibility (Alpine musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and smoke test in musl container
        run: |
          docker run --rm -v "$PWD:/work:ro" alpine:3.20 sh -eu -c '
            apk add --no-cache bash coreutils findutils git grep tar
            cd /work
            VERSION=0.0.0-dev COMMIT=container OUTPUT=/tmp/multigravity-linux-all bash ./scripts/build
            bash -n /tmp/multigravity-linux-all
            test "$(/tmp/multigravity-linux-all version --short)" = 0.0.0-dev
          '
